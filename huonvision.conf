<VirtualHost *:80>
    ServerName huovision.brickservers.ng
    ServerAlias www.huovision.brickservers.ng
    ServerAlias 184.192.242.60

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    ProxyTimeout 300

    ErrorLog "/opt/bitnami/apache/logs/huovision.brickservers.ng-error_log"
    CustomLog "/opt/bitnami/apache/logs/huovision.brickservers.ng-access_log" common
</VirtualHost>
