<VirtualHost *:80>
    ServerName huovision.brickservers.ng
    ServerAlias www.huovision.brickservers.ng
    ServerAlias 184.192.242.60

    DocumentRoot "/opt/bitnami/apache2/htdocs/huonvision/frontend/www.huonvision.com"
    DirectoryIndex index.html

    <Directory "/opt/bitnami/apache2/htdocs/huonvision/frontend">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/opt/bitnami/apache2/htdocs/huonvision/frontend/www.huonvision.com">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # Exclude backend proxies from rewrites
    RewriteCond %{REQUEST_URI} ^/(api|admin|_next|login|signup|cart|checkout|account) [NC]
    RewriteRule .* - [L]

    # static.parastorage.com: serve local if exists, else proxy to upstream CDN
    RewriteCond /opt/bitnami/apache2/htdocs/huonvision/frontend/static.parastorage.com/$1 -f
    RewriteRule ^/static\.parastorage\.com/(.*)$ /opt/bitnami/apache2/htdocs/huonvision/frontend/static.parastorage.com/$1 [L]
    RewriteRule ^/static\.parastorage\.com/(.*)$ https://static.parastorage.com/$1 [P,L]

    # Logo Direct Local Serve (matches any query, fill parameters, or double path)
    RewriteRule ^.*88a5c5_ed38a0f979fb4a23b892256d412e0d86~mv2\.png.*$ /opt/bitnami/apache2/htdocs/huonvision/frontend/static.wixstatic.com/media/88a5c5_ed38a0f979fb4a23b892256d412e0d86~mv2.png [L]

    # static.wixstatic.com: serve local if exists, else proxy to upstream CDN
    RewriteCond /opt/bitnami/apache2/htdocs/huonvision/frontend/static.wixstatic.com/$1 -f
    RewriteRule ^/static\.wixstatic\.com/(.*)$ /opt/bitnami/apache2/htdocs/huonvision/frontend/static.wixstatic.com/$1 [L]
    RewriteRule ^/static\.wixstatic\.com/(.*)$ https://static.wixstatic.com/$1 [P,L]

    # browser.sentry-cdn.com: serve local if exists, else proxy
    RewriteCond /opt/bitnami/apache2/htdocs/huonvision/frontend/browser.sentry-cdn.com/$1 -f
    RewriteRule ^/browser\.sentry-cdn\.com/(.*)$ /opt/bitnami/apache2/htdocs/huonvision/frontend/browser.sentry-cdn.com/$1 [L]
    RewriteRule ^/browser\.sentry-cdn\.com/(.*)$ https://browser.sentry-cdn.com/$1 [P,L]

    # _partials: serve local if exists, else proxy
    RewriteCond /opt/bitnami/apache2/htdocs/huonvision/frontend/www.huonvision.com/_partials/$1 -f
    RewriteRule ^/_partials/(.*)$ /opt/bitnami/apache2/htdocs/huonvision/frontend/www.huonvision.com/_partials/$1 [L]
    RewriteRule ^/_partials/(.*)$ https://www.huonvision.com/_partials/$1 [P,L]

    # Pricing plans routes
    RewriteRule ^/pricing-plans/?$ /pricing-plans/plans-pricing.html [L]
    RewriteRule ^/plans-pricing/?$ /pricing-plans/plans-pricing.html [L]

    # Booking calendar clean URLs
    RewriteCond %{DOCUMENT_ROOT}/booking-calendar/$1.html -f
    RewriteRule ^/booking-calendar/([^/]+)/?$ /booking-calendar/$1.html [L]

    # Blog post clean URLs
    RewriteCond %{DOCUMENT_ROOT}/post/$1.html -f
    RewriteRule ^/post/([^/]+)/?$ /post/$1.html [L]

    # Service page clean URLs (sub-slugs rewrite to service-page.html)
    RewriteRule ^/service-page/.*$ /service-page.html [L]

    # Standard root clean URLs (.html extension)
    RewriteCond %{DOCUMENT_ROOT}/$1.html -f
    RewriteRule ^/([^/]+)/?$ /$1.html [L]

    ProxyPreserveHost On

    # Next.js Backend Endpoints
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    ProxyPass /admin http://127.0.0.1:3000/admin
    ProxyPassReverse /admin http://127.0.0.1:3000/admin

    ProxyPass /_next http://127.0.0.1:3000/_next
    ProxyPassReverse /_next http://127.0.0.1:3000/_next

    ProxyPass /login http://127.0.0.1:3000/en/login
    ProxyPassReverse /login http://127.0.0.1:3000/en/login

    ProxyPass /signup http://127.0.0.1:3000/en/signup
    ProxyPassReverse /signup http://127.0.0.1:3000/en/signup

    ProxyPass /cart http://127.0.0.1:3000/en/cart
    ProxyPassReverse /cart http://127.0.0.1:3000/en/cart

    ProxyPass /checkout http://127.0.0.1:3000/en/checkout
    ProxyPassReverse /checkout http://127.0.0.1:3000/en/checkout

    ProxyPass /account http://127.0.0.1:3000/en/account
    ProxyPassReverse /account http://127.0.0.1:3000/en/account

    ErrorLog "/opt/bitnami/apache2/logs/huovision.brickservers.ng-error_log"
    CustomLog "/opt/bitnami/apache2/logs/huovision.brickservers.ng-access_log" common
</VirtualHost>
